# Publica la web de Lumina en GitHub Pages cada vez que se sube algo a main.
#
# Publica dist/index.html (generado con `node build.js`, todo embebido) como /index.html.
# Login: el build ya embebe gate.js (mismos usuarios que ZLT-WEB-PRESENTACIONES y ZLT-WEB-V2)
# justo después de </title>; acá solo se verifica que esté. Sigue en noindex hasta la mudanza.
# Para sacar el login: `node build.js --sin-login` y borrar el bloque "Login".

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          set -euo pipefail
          test -s dist/index.html || { echo "Falta dist/index.html: correr node build.js y volver a subir"; exit 1; }
          mkdir -p _site
          cp dist/index.html _site/index.html
          # Login: el gate tiene que estar embebido una sola vez
          f=_site/index.html
          [ "$(grep -o 'zlt-gate-v1-2026' "$f" | wc -l)" = 1 ] || { echo "El login no quedó una sola vez en $f: correr node build.js"; exit 1; }
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
